<script>
// ================= DEALS: comp a deal =================
const TAGL={crane:'Crane-served',heavy_power:'Heavy power',manufacturing:'Manufacturing',ios:'IOS / yard',yard:'Yard',truck_terminal:'Truck terminal',rail:'Rail',shallow_bay:'Shallow bay',multi_tenant:'Multi-tenant',flex:'Flex',bulk:'Bulk / big box',cross_dock:'Cross-dock',rear_load:'Rear-load',front_load:'Front-load',cold_storage:'Cold storage',service:'Service center'};
const FACTL={building_sf:['Size',v=>fmt.sf(v)],land_acres:['Land',v=>fmt.ac(v)],clear_height_ft:['Clear',v=>v+"'"],year_built:['Built',v=>v],year_renovated:['Renovated',v=>v],construction:['Construction',v=>LBL[v]||v],loading:['Loading',v=>LBL[v]||v],dock_doors:['Dock-high',v=>v],drive_in_doors:['Grade-level',v=>v],cranes:['Cranes',v=>v],power:['Power',v=>v],rail_served:['Rail',v=>v?'Yes':'No'],yard_acres:['Yard',v=>fmt.ac(v)],building_class:['Class',v=>v],tenancy:['Tenancy',v=>v],occupancy_pct:['Leased',v=>v+'%'],office_pct:['Office',v=>v+'%'],sprinkler:['Sprinklers',v=>v],property_subtype:['Product',v=>LBL[v]||v],tenant:['Tenant',v=>v],walt_years:['WALT',v=>v+' yrs'],asking_price:['Price',v=>fmt.usd(v)],price_psf:['$/SF',v=>fmt.psf(v)],cap_rate_pct:['Cap',v=>fmt.pct(v)],in_place_rent_psf_yr:['In-place rent',v=>fmt.psf(v)+'/yr']};
const SRCL={'write-up':'from write-up',manual:'edited',broker_sheet:'comp file',costar:'CoStar',cad:'county',parcel:'parcel',om:'OM',aerial:'satellite'};
const PARTL=[['product','Type'],['size','Size'],['location','Distance'],['recency','Recency'],['clear_height','Clear'],['vintage','Vintage'],['features','Features'],['data','Data']];
let DEALS=[],DEAL=null,DLANE='sale',SLANE=null,DFOCUS=0,USEADJ=false,setMap=null,setMarks=[],DEALLOAD=0;
const isSaleK=k=>k==='sale'||k==='land_sale';

async function loadDealList(){try{const r=await api('/api/v2/deals');DEALS=r.deals}catch(e){DEALS=[]}renderDealList()}
function renderDealList(){const id=DEAL?.deal?.id;
 $('#dl').innerHTML=`<button class="btn primary new" id="dnew">+ New deal</button>`+DEALS.map(d=>`<div class="di ${d.id===id?'on':''}" data-d="${d.id}"><b>${esc(d.name)}${d.n_alerts?'<span class="ad" title="new matching comps"></span>':''}</b><span class="s1">${esc([...new Set([d.city,d.market].filter(Boolean))].join(' · ')||'—')}</span><br><span class="s1">${d.lanes.includes('sale')?`<span class="badge b-sale">${d.n_sale} sale</span> `:''}${d.lanes.includes('lease')?`<span class="badge b-lease">${d.n_lease} lease</span>`:''}</span></div>`).join('')+`<div class="arch" id="darch">${DEALS.length?DEALS.length+' active deal'+(DEALS.length>1?'s':''):''}</div>`;
 $('#dnew').onclick=()=>newDealModal();$$('#dl .di').forEach(e=>e.onclick=()=>{location.hash='#deal/'+e.dataset.d})}
async function dealsShow(sub){if(!DEALS.length)await loadDealList();else renderDealList();
 const id=sub&&+sub;if(id){if(DEAL?.deal?.id!==id)openDeal(id);return}
 if(DEALS.length&&!isMobile()&&!sub){history.replaceState(null,'','#deal/'+DEALS[0].id);openDeal(DEALS[0].id);return}
 DEAL=null;renderDealList();$('#ds').innerHTML='';$('#ds').classList.remove('on');$('#msetbtn').style.display='none';heroHtml()}
function heroHtml(){$('#dm').innerHTML=`<div class="hero"><h1>Comp a deal</h1><div class="muted" style="font-size:14px">Paste the Slack write-up, OM text or broker email, or type an address. The subject's facts come from what you paste first, then from our database, CoStar and county records, each marked with its source. You get ranked sale and lease comps to add or pass, a comp set with stats and a map, and exports for the memo.</div>
 <div class="card" style="padding:14px;margin-top:14px"><textarea id="htext" style="width:100%;min-height:150px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;resize:vertical" placeholder="e.g. 13026 Rosecrest Drive – Investment Summary · Southwest Far, inside Beltway 8 · 52,000 SF on 7.77 acres with laydown yard · metal, built 1950 · 25' clear · crane-ready (1 × 20-ton + 3 × 5-ton) · 2 docks, 5 drive-ins"></textarea>
 <div class="row2" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center"><input type="text" id="haddr" placeholder="…or just an address" style="flex:1;min-width:200px"/><label class="faint"><input type="checkbox" id="hs" checked> Sale comps</label><label class="faint"><input type="checkbox" id="hl" checked> Lease comps</label><button class="btn primary" id="hgo">Comp this deal</button></div></div>
 <div class="faint" style="margin-top:10px">Tip: lease comps for a size band work too, e.g. "450,000 - 1,000,000 SF leases around 1085 Heritage West Dr, Katy".</div></div>`;
 $('#hgo').onclick=()=>createDeal($('#htext').value,$('#haddr').value,[$('#hs').checked&&'sale',$('#hl').checked&&'lease'].filter(Boolean),$('#hgo'))}
function newDealModal(prefill={}){openModal(`<h3>New deal</h3><div class="muted" style="margin-bottom:10px">Paste a write-up / OM text / broker email, or type an address.</div><textarea id="mtext" placeholder="Paste the investment summary…">${esc(prefill.text||'')}</textarea>
 <div class="row2"><input type="text" id="maddr" placeholder="Address (optional)" value="${esc(prefill.address||'')}" style="flex:1;min-width:200px"/><label class="faint"><input type="checkbox" id="ms" ${prefill.lanes&&!prefill.lanes.includes('sale')?'':'checked'}> Sale comps</label><label class="faint"><input type="checkbox" id="ml" ${prefill.lanes&&!prefill.lanes.includes('lease')?'':'checked'}> Lease comps</label></div>
 <div class="row2" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="mgo">Comp this deal</button></div>`);
 setTimeout(()=>$('#mtext').focus(),50);$('#mgo').onclick=()=>createDeal($('#mtext').value,$('#maddr').value,[$('#ms').checked&&'sale',$('#ml').checked&&'lease'].filter(Boolean),$('#mgo'))}
function openModal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
async function createDeal(text,address,lanes,btn){text=(text||'').trim();address=(address||'').trim();if(!text&&!address)return toast('Paste a write-up or type an address');if(!lanes.length)lanes=['sale','lease'];
 const old=btn.textContent;btn.disabled=true;btn.textContent='Reading the write-up…';
 try{const r=await api('/api/v2/deals',{method:'POST',body:JSON.stringify({text,address,lanes})});closeModal();await loadDealList();location.hash='#deal/'+r.id}
 catch(e){toast(e.message,5000)}finally{btn.disabled=false;btn.textContent=old}}
function newDealFromProperty(p){newDealModal({address:[p.address||p.property_name,p.city].filter(Boolean).join(', ')})}

async function openDeal(id,keepLane){const my=++DEALLOAD;
 if(!keepLane){$('#dm').innerHTML='<div class="card subj"><div class="skel" style="height:90px;border:0"></div></div>'+'<div class="skel"></div>'.repeat(5);$('#ds').innerHTML='<div class="skel"></div>'.repeat(3)}
 try{const d=await api('/api/v2/deals/'+id);if(my!==DEALLOAD)return;DEAL=d;
  if(!keepLane){DLANE=d.deal.lanes[0]||'sale';SLANE=DLANE;DFOCUS=0}
  renderDealList();renderDeal();renderSet()}catch(e){$('#dm').innerHTML=`<div class="empty"><h3>Couldn't open this deal</h3>${esc(e.message)}</div>`}}
async function reloadDeal(){if(DEAL)await openDeal(DEAL.deal.id,true);loadDealList()}

function factChips(s){const f=s.facts||{};return Object.entries(FACTL).filter(([k])=>f[k]&&f[k].value!=null&&f[k].value!=='').map(([k,[l,fn]])=>`<span class="fact" title="${esc(f[k].ref||'')}"><span class="k">${l}</span><b>${esc(String(fn(f[k].value)))}</b><span class="srcb ${f[k].source==='write-up'?'w':''}">${esc(SRCL[f[k].source]||f[k].source)}</span></span>`).join('')}
function renderDeal(){const D=DEAL.deal,s=D.subject||{},sr=D.search||{};const tags=s.tags||[];const alertIds=new Set((DEAL.alerts||[]).flatMap(a=>a.comp_ids));
 const ce=Object.entries(s.conflicts||{}).filter(([k])=>!['cranes','power','tenant','property_subtype','sprinkler'].includes(k));
 const conf=ce.length?`<div class="conf" style="display:block"><div style="margin-bottom:4px">△ Our database disagrees with the write-up on ${ce.length} fact${ce.length>1?'s':''}. The write-up is used.</div>${ce.map(([k,c])=>`<div style="display:flex;gap:8px;align-items:center;padding:3px 0;border-top:1px solid #f0e2c4"><span style="flex:1">${esc(FACTL[k]?.[0]||k)}: write-up <b>${esc(String(FACTL[k]?FACTL[k][1](s.facts[k]?.value):s.facts[k]?.value))}</b> · ${esc(SRCL[c.source]||c.source)} <b>${esc(String(FACTL[k]?FACTL[k][1](c.value):c.value))}</b></span><button class="btn sm" data-usedb="${k}" data-v="${esc(String(c.value))}">Use ${esc(SRCL[c.source]||c.source)}</button><button class="btn sm" data-keep="${k}">OK</button></div>`).join('')}</div>`:'';
 const lanes=D.lanes.map(l=>{const L=DEAL.lanes[l];return `<button class="btn sm ${DLANE===l?'primary':''}" data-lane="${l}">${l==='sale'?'Sale':'Lease'} comps · ${L?L.rows.filter(r=>!r.relaxed).length:0}</button>`}).join('');
 const L=DEAL.lanes[DLANE]||{rows:[],history:[]};
 const passed=DEAL.items.filter(i=>i.state==='pass'&&(DLANE==='sale'?isSaleK(i.comp.record_kind):!isSaleK(i.comp.record_kind)));
 const passIds=new Set(passed.map(i=>i.comp_id));
 const rows=L.rows.filter(r=>!passIds.has(r.id));const exact=rows.filter(r=>!r.relaxed),near=rows.filter(r=>r.relaxed);
 const since=sr.since?sr.since.slice(0,4):'';const yrs=sr.since?Math.round((Date.now()-new Date(sr.since))/3.15e10):3;
 $('#dm').innerHTML=`<div class="card subj">
  <div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1;min-width:0"><h2>${esc(D.name)}</h2><div class="loc">${esc([D.address&&D.address!==D.name?D.address:null,D.city,D.submarket,D.market].filter(Boolean).join(' · '))}${D.geocode_quality==='submarket'?' · <span class="badge b-warn">located to submarket</span>':''}${D.latitude==null?' · <span class="badge b-bad">not located - add an address</span>':''}</div></div>
  <button class="btn sm" id="dedsub">Edit subject</button><button class="btn sm" id="dmore" title="More">⋯</button></div>
  <div class="facts">${factChips(s)||'<span class="muted">No facts yet - edit the subject to add size, clear height, vintage…</span>'}</div>${conf}
  <div class="tagrow"><span class="faint" style="font-size:12px">Product match on</span>${tags.length?tags.map(t=>`<span class="tg on ro">${esc(TAGL[t]||t)}</span>`).join(''):'<span class="faint" style="font-size:12px">any industrial (no product tags)</span>'}<button class="btn sm" id="dtags">Change</button></div>
  <div class="searchset">Within <select id="srad">${[1,2,3,5,8,12,20,35].map(m=>`<option ${(+sr.radius_mi||(D.geocode_quality==='submarket'?6:5))===m?'selected':''}>${m}</option>`).join('')}${![1,2,3,5,8,12,20,35].includes(+sr.radius_mi||5)&&sr.radius_mi?`<option selected>${sr.radius_mi}</option>`:''}</select> mi
   · since <select id="ssince">${[[1,'12 months'],[2,'24 months'],[3,'36 months'],[5,'5 years'],[10,'10 years']].map(([y,l])=>`<option value="${y}" ${yrs===y?'selected':''}>${l}</option>`).join('')}</select>
   · size <input type="number" id="smin" placeholder="min SF" style="width:100px" value="${sr.size_sf?.min||''}"/>–<input type="number" id="smax" placeholder="max SF" style="width:100px" value="${sr.size_sf?.max||''}"/>
   <button class="btn sm" id="sapply">Update</button>${D.source_text?'<a class="faint" style="cursor:pointer;margin-left:auto" id="swu">Show write-up</a>':''}</div>
  <div class="wu" id="wu">${esc(D.source_text||'')}</div></div>
  ${(DEAL.alerts||[]).length?`<div class="watch" style="margin:0 0 10px">★ ${esc(DEAL.alerts[0].title)} since you last looked. They're marked <span class="newb">NEW</span> below.<span style="flex:1"></span><button class="btn sm" id="dseen">Dismiss</button></div>`:''}
  <div class="lanebar">${lanes}<span class="faint" style="margin-left:auto;font-size:12px">Ranked by match to the subject · <span class="kbd">A</span> add · <span class="kbd">X</span> pass · <span class="kbd">J</span>/<span class="kbd">K</span> move</span></div>
  ${L.note?`<div class="empty">${esc(L.note)}</div>`:''}
  <div class="card sugt" style="overflow:auto">${exact.length?sugHead():''}${exact.map((r,i)=>sugHtml(r,i,alertIds)).join('')||'<div class="empty"><h3>No comps match yet</h3>Widen the radius or the date range, or change the product match.</div>'}</div>
  ${near.length?`<div class="sect">Near misses <span class="faint" style="text-transform:none">· outside the size, date or distance limits</span></div><div class="card sugt" style="overflow:auto">${sugHead()}${near.map((r,i)=>sugHtml(r,exact.length+i,alertIds)).join('')}</div>`:''}
  ${(L.history||[]).length?`<div class="sect">Deals at the subject itself (not comps)</div><div class="card" style="padding:8px 14px">${L.history.map(h=>`<div style="padding:4px 0">${KL[h.record_kind]} ${fmt.date(h.txn_date)} · ${h.record_kind==='lease'?fmt.psf(h.rent_psf_yr)+'/yr'+(h.tenant?' · '+esc(h.tenant):''):fmt.psf(h.price_psf)+'/SF'+(h.buyer?' · '+esc(h.buyer):'')} <span class="faint">${esc(h.source_label||'')}</span></div>`).join('')}</div>`:''}
  ${passed.length?`<details style="margin-top:12px"><summary class="sect" style="cursor:pointer;display:inline">Passed (${passed.length})</summary><div class="card" style="margin-top:6px">${passed.map(i=>`<div style="display:flex;gap:8px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line2)"><span>${esc(i.comp.address||i.comp.property_name||'')}</span><span class="faint">${fmt.date(i.comp.txn_date)} ${i.reason?'· '+esc(i.reason):''}</span><span style="flex:1"></span><button class="btn sm" data-unpass="${i.comp_id}">Undo</button></div>`).join('')}</div></details>`:''}`;
 bindDeal(rows)}
function partBar(v){if(v==null)return '<div class="bar" style="background:repeating-linear-gradient(90deg,#eee 0 3px,#fff 3px 6px)"></div>';const c=v>=70?'g':v>=40?'y':'r';return `<div class="bar"><i class="${c}" style="width:${v}%"></i></div>`}
function whyLine(r){const g=[],b=[],p=r.parts||{};
 if(r.tag_state==='match')g.push('same product');else if(r.tag_state==='related')g.push('related product');else if(r.tag_state==='unknown')b.push('building type unknown');
 const sf=r.size_sf;if(p.size>=75&&sf)g.push(fmt.sf(sf));else if(p.size!=null&&p.size<40&&sf)b.push(fmt.sf(sf)+' (size off)');
 if(r.distance_mi!=null)(r.distance_mi<=3?g:r.distance_mi>8?b:[]).push(fmt.mi(r.distance_mi)+' away');
 if(p.recency!=null&&p.recency<45)b.push('older deal');if(p.clear_height!=null&&p.clear_height<=45&&r.clear_height_ft==null)b.push('clear unknown');
 if(r.flags&&r.flags.length)b.push(r.flags[0]);
 return (g.length?'✓ '+g.join(', '):'')+(b.length?(g.length?' · ':'')+'△ '+b.join(', '):'')}
function valLine(r){if(isSaleK(r.record_kind))return [r.sale_price&&`<b>${fmt.usd(r.sale_price)}</b>`,r.price_psf&&`<b>${fmt.psf(r.price_psf)}</b>/SF`,r.cap_rate_pct&&`<b>${fmt.pct(r.cap_rate_pct)}</b> cap`,r.buyer&&'Buyer '+esc(r.buyer)].filter(Boolean).join(' · ')||'<span class="faint">price undisclosed</span>';
 if(r.record_kind==='listing')return `Asking <b>${r.asking_rent_psf_yr?fmt.psf(r.asking_rent_psf_yr)+'/SF/yr':'n/a'}</b>`;
 return [r.rent_psf_yr!=null&&`<b>${fmt.psf(r.rent_psf_yr)}</b>/SF/yr ${esc(r.rent_basis||r.lease_structure||'')}`,r.term_months&&Math.round(r.term_months)+' mo',r.escalation_pct&&fmt.pct(r.escalation_pct)+' bumps',r.free_rent_months&&r.free_rent_months+' mo free',r.tenant&&esc(r.tenant)].filter(Boolean).join(' · ')||'<span class="faint">rent n/a</span>'}
function sugHead(){return `<div class="sugh"><div>Match</div><div>Address</div><div>Signed</div><div class="n">SF</div><div class="n">Rent / price</div><div class="n">Term / cap</div><div>Tenant / buyer</div><div></div></div>`}
function sugHtml(r,i,alertIds){const st=r.set_state;const p=r.parts||{};const sale=isSaleK(r.record_kind);
 const sc=r.score>=88?'hi':r.score>=80?'md':'';
 const val=sale?(r.price_psf?`<b>${fmt.psf(r.price_psf)}</b>/SF`:r.sale_price?`<b>${fmt.usd(r.sale_price)}</b>`:'<span class="faint">undisclosed</span>'):r.record_kind==='listing'?(r.asking_rent_psf_yr?`<b>${fmt.psf(r.asking_rent_psf_yr)}</b> ask`:'<span class="faint">n/a</span>'):(r.rent_psf_yr!=null?`<b>${fmt.psf(r.rent_psf_yr)}</b> <span class="u">${esc(r.rent_basis||r.lease_structure||'')}</span>`:'<span class="faint">n/a</span>');
 const tc=sale?(r.cap_rate_pct?fmt.pct(r.cap_rate_pct)+' cap':'<span class="faint">—</span>'):[r.term_months&&Math.round(r.term_months)+' mo',r.escalation_pct&&fmt.pct(r.escalation_pct)].filter(Boolean).join(' · ')||'<span class="faint">—</span>';
 const who=esc(sale?(r.buyer||''):(r.tenant||''))||'<span class="faint">—</span>';
 const fit=PARTL.filter(([k])=>p[k]!=null).slice(0,6).map(([k,l])=>`<i title="${l} ${Math.round(p[k])}" class="${p[k]>=70?'':p[k]>=40?'y':'r'}" style="height:${Math.max(3,Math.round(p[k]/100*16))}px"></i>`).join('');
 return `<div class="sug ${st==='add'?'added':''} ${i===DFOCUS?'focus':''}" data-c="${r.id}" data-i="${i}"><div><span class="hc-score ${sc}">${r.score}</span><div class="fx" title="Fit: type · size · distance · recency · clear · vintage">${fit}</div></div>
 <div style="min-width:0"><div class="ad">${esc(r.address||r.property_name||'Unknown address')}${alertIds.has(r.id)?'<span class="newb">NEW</span>':''}</div>
 <div class="mt">${esc([r.city,r.submarket].filter(Boolean).join(' · '))}${r.clear_height_ft?' · '+r.clear_height_ft+"' clear":''}${r.year_built?' · built '+r.year_built:''}${r.source_kind==='costar'?' · CoStar':''}</div><div class="why">${whyLine(r)}</div></div>
 <div class="nw">${fmt.date(r.txn_date)}</div><div class="n">${r.size_sf?Math.round(r.size_sf).toLocaleString('en-US'):'—'}</div><div class="n">${val}</div><div class="n">${tc}</div><div class="who">${who}</div>
 <div class="acts">${st==='add'?`<button class="btn sm" data-rm="${r.id}" title="Click to remove from the set">✓ In set</button>`:`<button class="btn sm primary" data-add="${r.id}">Add</button><button class="btn sm" data-pass="${r.id}">Pass</button>`}</div></div>`}
function bindDeal(rows){const D=DEAL.deal;
 $$('#dm [data-lane]').forEach(b=>b.onclick=()=>{DLANE=b.dataset.lane;SLANE=DLANE;DFOCUS=0;renderDeal();renderSet()});
 $$('#dm [data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();setItem(+b.dataset.add,'add')});
 $$('#dm [data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();removeItem(+b.dataset.rm)});
 $$('#dm [data-pass]').forEach(b=>b.onclick=e=>{e.stopPropagation();passItem(+b.dataset.pass,b)});
 $$('#dm [data-unpass]').forEach(b=>b.onclick=()=>removeItem(+b.dataset.unpass));
 $$('#dm .sug').forEach(el=>{el.onclick=()=>{const r=rows.find(x=>x.id==el.dataset.c);DFOCUS=+el.dataset.i;openProperty(r.property_id||r.pid,r)};el.onmouseenter=()=>hlSet(+el.dataset.c,true);el.onmouseleave=()=>hlSet(+el.dataset.c,false)});
 $('#dedsub').onclick=editSubject;$('#dtags').onclick=editTags;$('#dmore').onclick=e=>dealMenu(e.target);
 const wu=$('#swu');if(wu)wu.onclick=()=>{const w=$('#wu');w.style.display=w.style.display==='block'?'none':'block';wu.textContent=w.style.display==='block'?'Hide write-up':'Show write-up'};
 $('#sapply').onclick=async()=>{const y=+$('#ssince').value;const d=new Date();d.setFullYear(d.getFullYear()-y);const mn=+$('#smin').value||null,mx=+$('#smax').value||null;
  await api('/api/v2/deals/'+D.id,{method:'PATCH',body:JSON.stringify({search:{radius_mi:+$('#srad').value,since:d.toISOString().slice(0,10),size_sf:mn||mx?{min:mn,max:mx}:null}})});toast('Search updated');reloadDeal()};
 $$('#dm [data-usedb]').forEach(b=>b.onclick=async()=>{const k=b.dataset.usedb;let v=b.dataset.v;if(!isNaN(+v)&&v!=='')v=+v;await api('/api/v2/deals/'+D.id,{method:'PATCH',body:JSON.stringify({subject:{[k]:v}})});reloadDeal()});
 $$('#dm [data-keep]').forEach(b=>b.onclick=async()=>{const s=DEAL.deal.subject;await api('/api/v2/deals/'+D.id,{method:'PATCH',body:JSON.stringify({subject:{[b.dataset.keep]:s.facts[b.dataset.keep].value}})});reloadDeal()});
 const ds=$('#dseen');if(ds)ds.onclick=async()=>{await api(`/api/v2/deals/${D.id}/seen`,{method:'POST'});DEAL.alerts=[];renderDeal();loadDealList();loadAlerts()}}
async function setItem(cid,state,extra={}){const D=DEAL.deal;const r=(DEAL.lanes[DLANE]?.rows||[]).find(x=>x.id===cid);
 await api(`/api/v2/deals/${D.id}/items`,{method:'POST',body:JSON.stringify({comp_id:cid,state,score:r?.score,...extra})});
 if(state==='add')toast('Added to the comp set');await reloadDeal()}
async function removeItem(cid){await api(`/api/v2/deals/${DEAL.deal.id}/items/${cid}`,{method:'DELETE'});await reloadDeal()}
function passItem(cid,anchor){const reasons=['Wrong product','Too far','Too old','Wrong size','Bad data','Other'];

function staticMap(pts,w,h){// Esri static export in Web Mercator; returns {url, px(lat,lng)}
 const merc=(lat,lng)=>[lng*20037508.34/180,Math.log(Math.tan((90+lat)*Math.PI/360))*20037508.34/Math.PI];

 const pad=Math.max(x1-x0,y1-y0,4000)*0.18;x0-=pad;x1+=pad;y0-=pad;y1+=pad;const sx=(x1-x0)/w,sy=(y1-y0)/h,s=Math.max(sx,sy);const cx=(x0+x1)/2,cy=(y0+y1)/2;x0=cx-s*w/2;x1=cx+s*w/2;y0=cy-s*h/2;y1=cy+s*h/2;
