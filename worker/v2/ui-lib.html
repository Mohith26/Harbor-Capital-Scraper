<script>
// ================= LIBRARY: players, health, views, edits =================
let PLAYERS=[],PROLE='';
async function loadPlayers(q){$('#plist').innerHTML=`<div style="padding:10px 12px;border-bottom:1px solid var(--line)"><input type="search" id="pq" placeholder="Search a buyer, seller, tenant…" style="width:100%" value="${esc(q||'')}"/><div class="checks" style="margin-top:6px" id="prole">${[['','All'],['buyer','Buyers'],['seller','Sellers'],['tenant','Tenants'],['landlord','Landlords']].map(([v,l])=>`<label><input type="radio" name="pr" value="${v}" ${PROLE===v?'checked':''}>${l}</label>`).join('')}</div></div><div id="pitems">${'<div class="skel"></div>'.repeat(5)}</div>`;
 const pq=$('#pq');let t;pq.oninput=()=>{clearTimeout(t);t=setTimeout(()=>fetchPlayers(pq.value),300)};$$('#prole input').forEach(i=>i.onchange=()=>{PROLE=i.value;fetchPlayers(pq.value)});
 fetchPlayers(q||'');if(!$('#pmain').innerHTML)$('#pmain').innerHTML='<div class="empty"><h3>Who is doing deals</h3>Pick a buyer, seller, tenant or landlord to see every comp they are on, the markets and building types they favour, and when they were last active.</div>'}
async function fetchPlayers(q){try{const r=await api('/api/v2/players?'+new URLSearchParams({q:q||'',role:PROLE,limit:150}));PLAYERS=r.players;
 $('#pitems').innerHTML=PLAYERS.map(p=>`<div class="pi" data-p="${p.id}"><b>${esc(p.name)}</b><div class="faint" style="font-size:12px">${p.n_deals} deal${p.n_deals>1?'s':''} · ${esc(String(p.kinds||'').split('|').filter(Boolean).join(', '))}${p.last_date?' · last '+fmt.date(p.last_date):''}</div></div>`).join('')||'<div class="empty">No matches</div>';
 $$('#pitems .pi').forEach(e=>e.onclick=()=>openPlayerPage(+e.dataset.p))}catch(e){$('#pitems').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function openPlayerPage(id){if(!$('#pq'))loadPlayers();if($('#v-lib').classList.contains('on')&&location.hash!=='#player/'+id)history.replaceState(null,'','#player/'+id);$('#pmain').innerHTML='<div class="skel"></div>'.repeat(4);$$('#pitems .pi').forEach(e=>e.classList.toggle('on',+e.dataset.p===id));
 try{const d=await api('/api/v2/players/'+id);const p=d.player;const sales=d.comps.filter(c=>c.record_kind==='sale'||c.record_kind==='land_sale');const leases=d.comps.filter(c=>c.record_kind==='lease');
  const med=a=>{const v=a.filter(x=>x!=null).sort((x,y)=>x-y);return v.length?v[v.length>>1]:null};
  $('#pmain').innerHTML=`<div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1"><div class="muted">${esc(d.roles.map(([r,n])=>`${n} as ${r}`).join(' · '))}</div><h2 style="margin:2px 0 6px;font-size:20px">${esc(p.name)}</h2></div><button class="btn sm" id="pmerge">Merge into…</button></div>
  <div class="tiles"><div class="tile"><div class="l">Deals</div><div class="v">${d.comps.length}</div></div><div class="tile"><div class="l">Last active</div><div class="v" style="font-size:16px">${fmt.date(p.last_date)}</div></div><div class="tile"><div class="l">Median $/SF (sales)</div><div class="v">${sales.length?fmt.psf(med(sales.map(c=>c.price_psf))):'—'}</div></div><div class="tile"><div class="l">Median rent (leases)</div><div class="v">${leases.length?fmt.psf(med(leases.map(c=>c.rent_psf_yr))):'—'}</div></div></div>
  <div class="sect">Where and what</div><div class="tagrow" style="margin:0">${d.markets.map(([m,n])=>`<span class="tg ro">${esc(m)} · ${n}</span>`).join('')}${d.submarkets.map(([m,n])=>`<span class="tg ro">${esc(m)} · ${n}</span>`).join('')}${d.tags.slice(0,8).map(([t,n])=>`<span class="tg ro" style="background:var(--peach-soft)">${esc(TAGL[t]||t)} · ${n}</span>`).join('')}</div>
  ${d.aliases.length?`<div class="faint" style="margin-top:6px;font-size:12px">Also recorded as: ${d.aliases.map(esc).join(', ')}</div>`:''}
  <div class="sect">Every deal</div><div class="tablewrap card" style="overflow:auto">${tableHtml(d.comps.map(c=>({...c,_role:c.role})),false)}</div>`;
  $$('#pmain tbody tr[data-id]').forEach(tr=>tr.onclick=()=>{const c=d.comps.find(x=>x.id==tr.dataset.id);openProperty(c.property_id,c)});
  $('#pmerge').onclick=async()=>{const n=prompt(`Merge "${p.name}" into which buyer/tenant? Type part of the name:`);if(!n)return;const r=await api('/api/v2/players?'+new URLSearchParams({q:n,limit:8}));const c=r.players.filter(x=>x.id!==p.id);if(!c.length)return toast('No match');
   pickMenu($('#pmerge'),c.map(x=>[`${esc(x.name)} (${x.n_deals})`,async()=>{if(!confirm(`Merge "${p.name}" into "${x.name}"? Future files will map to "${x.name}" too.`))return;await api(`/api/v2/players/${p.id}/merge`,{method:'POST',body:JSON.stringify({into:x.id})});toast('Merged');location.hash='#player/'+x.id;fetchPlayers($('#pq').value)}]))}}
 catch(e){$('#pmain').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

// ---------- Health: coverage + fix queues ----------
let QSEL=null;
async function loadQuality(){$('#qbody').innerHTML='<div class="skel"></div>'.repeat(3);try{const [h,qq]=await Promise.all([api('/api/v2/health/queues'),api('/api/v2/quality')]);const c=h.coverage;const pct=k=>c.n?Math.round(100*c[k]/c.n):0;
 const srcN={};h.sources.forEach(s=>srcN[s.k]=(srcN[s.k]||0)+s.n);
 $('#qbody').innerHTML=`<div class="sect" style="margin-top:0">Building facts we know (${c.n.toLocaleString()} buildings with a live comp)</div>
 <div class="qcards">${[['Building SF','sf',95],['Clear height','clear',85],['Year built','yb',90],['Land','land',90],['Product type','tags',90],['Loading','loading',70],['Construction','construction',70],['Street-level location','located',95]].map(([l,k,tg])=>`<div class="qcard" style="cursor:default"><div class="l">${l}</div><div class="v">${pct(k)}%</div><div class="meter"><i style="width:${pct(k)}%;background:${pct(k)>=tg?'var(--ok)':pct(k)>=tg-25?'#c99a2e':'var(--bad)'}"></i></div><div class="faint" style="font-size:11px;margin-top:3px">target ${tg}%</div></div>`).join('')}</div>
 <div class="sect">Fix queues · click one</div><div class="qcards">${Object.entries(h.queues).map(([k,q])=>`<div class="qcard ${QSEL===k?'on':''}" data-q="${k}"><div class="l">${esc(q.label)}</div><div class="v">${q.n.toLocaleString()}</div></div>`).join('')}<div class="qcard" data-go="inbox"><div class="l">Rows held in the Inbox</div><div class="v">${h.held}</div></div></div>
 <div id="qlist"></div>
 <div class="sect">Where comps come from</div><div class="kv">${Object.entries(srcN).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span>${esc({broker:'Broker files',costar:'CoStar archive',legacy:'Old comp tool',manual:'Typed in'}[k]||k)} <b>${n.toLocaleString()}</b></span>`).join('')}</div>
 <div class="sect">Buildings where sources disagree (${qq.feature_conflicts.length})</div><div class="panel" style="padding:0">${qq.feature_conflicts.slice(0,100).map(c=>`<div class="rv" style="grid-template-columns:minmax(200px,1fr) 2fr;cursor:pointer" data-p="${c.id}"><div><b>${esc(c.address||'')}</b><div class="faint">${esc(c.city||'')}</div></div><div class="kv" style="margin-top:0">${Object.entries(c.conflicts).map(([f,v])=>`<span>${esc(f.replace(/_/g,' '))}: using <b>${esc(String(c.best?.[f]?.value??'?'))}</b> (${esc(SRC[c.best?.[f]?.source]||c.best?.[f]?.source||'')}) vs ${v.map(x=>`<b>${esc(String(x.value))}</b> (${esc(SRC[x.source]||x.source)})`).join(', ')}</span>`).join('')}</div></div>`).join('')||'<div class="muted" style="padding:12px">None</div>'}</div>
 <div class="sect">Realistic ranges used for checks</div><div class="faint">Sale $/SF 35–325 (hard 8–900) · cap 4–10% (hard 2–15%) · NNN rent $3.50–22/SF/yr (hard 1.50–60) or $0.30–1.85/SF/mo · IOS $700–9,000/AC/mo · term 12–132 mo · bumps 2–5.5% · TI $0–25/SF · clear 12–42 ft · year built 1950–now · land 0.25–120 AC.</div>`;
 $$('#qbody [data-q]').forEach(e=>e.onclick=()=>{QSEL=e.dataset.q;$$('#qbody [data-q]').forEach(x=>x.classList.toggle('on',x===e));loadQueue(QSEL,h.queues[QSEL])});
 $$('#qbody [data-go]').forEach(e=>e.onclick=()=>show('inbox'));$$('#qbody [data-p]').forEach(r=>r.onclick=()=>openProperty(+r.dataset.p));
 if(QSEL)loadQueue(QSEL,h.queues[QSEL])}catch(e){$('#qbody').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function loadQueue(k,q){$('#qlist').innerHTML='<div class="skel"></div>';const r=await api('/api/v2/health/queues/'+k);
 $('#qlist').innerHTML=`<div class="panel" style="margin-top:8px"><b>${esc(q.label)}</b> <span class="muted">· ${esc(q.hint)}</span></div><div class="tablewrap card" style="margin-top:6px;overflow:auto;max-height:55vh"><table class="t"><thead><tr><th>Type</th><th>Date</th><th>Address</th><th>City</th><th class="n">SF</th><th class="n">$/SF</th><th class="n">Rent</th><th>Issue</th><th>Source</th></tr></thead><tbody>${r.rows.map(x=>`<tr data-p="${x.property_id}"><td><span class="badge b-${x.record_kind}">${KL[x.record_kind]}</span></td><td>${fmt.date(x.txn_date)}${x.date_precision&&x.date_precision!=='day'&&x.date_precision!=='none'?` <span class="faint">(${x.date_precision})</span>`:''}</td><td>${esc(x.address||x.property_name||'')}</td><td>${esc(x.city||'')}</td><td class="n">${x.building_sf?Math.round(x.leased_sf||x.building_sf).toLocaleString():''}</td><td class="n">${x.price_psf?fmt.psf(x.price_psf):''}</td><td class="n">${x.rent_psf_yr?fmt.psf(x.rent_psf_yr):''}</td><td style="max-width:320px;white-space:normal;color:var(--warn)">${esc((x.flags||[]).map(f=>f.msg)[0]||'')}</td><td>${esc(x.source_label||'')}</td></tr>`).join('')}</tbody></table></div>${r.rows.length>=100?'<div class="faint" style="margin-top:4px">Showing the 100 newest.</div>':''}`;
 $$('#qlist tr[data-p]').forEach(tr=>tr.onclick=()=>openProperty(+tr.dataset.p))}

// ---------- Library comps: tags, saved views, column chooser, Excel ----------
let DBTAG='',DBVIEWID=null;
(function libExtras(){const tb=$('#v-lib .toolbar');
 tb.insertAdjacentHTML('afterend',`<div class="toolbar" style="padding-top:0;border-top:0" id="dbtags"><span class="faint" style="font-size:12px">Product</span>${['crane','heavy_power','ios','truck_terminal','shallow_bay','multi_tenant','bulk','cross_dock','cold_storage','flex','rail'].map(t=>`<span class="tg" data-t="${t}">${TAGL[t]}</span>`).join('')}<span style="flex:1"></span><select id="dbviews"><option value="">Saved views…</option></select><button class="btn sm" id="dbsave">Save view</button><button class="btn sm" id="dbcols">Columns</button><button class="btn sm" id="dbxlsx">Excel</button></div>`);
 $$('#dbtags .tg').forEach(t=>t.onclick=()=>{t.classList.toggle('on');DBTAG=$$('#dbtags .tg.on').map(x=>x.dataset.t).join(',');DBPAGE=1;loadDb()});
 $('#dbsave').onclick=async()=>{const n=prompt('Name this view (it is shared with the team)');if(!n)return;await api('/api/v2/saved',{method:'POST',body:JSON.stringify({kind:'view',name:n,filters:dbParams()})});toast('View saved');loadViews()};
 $('#dbviews').onchange=()=>{const v=VIEWS.find(x=>x.id==$('#dbviews').value);if(!v)return;applyView(v.filters||{})};
 $('#dbxlsx').onclick=dbExcel;$('#dbcols').onclick=colChooser;$('#dbcsv').style.display='none';loadViews()})();
let VIEWS=[];
async function loadViews(){try{const r=await api('/api/v2/saved?kind=view');VIEWS=r.saved;const s=$('#dbviews');s.innerHTML='<option value="">Saved views…</option>'+VIEWS.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}catch{}}
function dbParams(){return {kind:dbKind,q:$('#dbq').value,market:$('#dbmarket').value,severity:$('#dbsev').value,sort:$('#dbsort').value,tag:DBTAG}}
function applyView(f){dbKind=f.kind||'';$$('#dbkind button').forEach(x=>x.classList.toggle('on',x.dataset.k===dbKind));$('#dbq').value=f.q||'';$('#dbmarket').value=f.market||'';$('#dbsev').value=f.severity||'';$('#dbsort').value=f.sort||'newest';DBTAG=f.tag||'';$$('#dbtags .tg').forEach(t=>t.classList.toggle('on',DBTAG.split(',').includes(t.dataset.t)));DBPAGE=1;loadDb()}
// override loadDb to carry tags
loadDb=async function(){dbLoaded=true;$('#dblist').innerHTML='<div class="skel"></div>'.repeat(8);
 const p=new URLSearchParams({...dbParams(),limit:DBPER,offset:(DBPAGE-1)*DBPER});
 try{const r=await api('/api/v2/comps?'+p);DBR=r.rows;DBTOTAL=r.total;renderDb()}catch(e){$('#dblist').innerHTML=`<div class="empty">${esc(e.message)}</div>`}};
async function dbExcel(){toast('Building the Excel file…');const p=new URLSearchParams({...dbParams(),limit:5000,offset:0});const r=await api('/api/v2/comps?'+p);
 const res=await fetch('/api/v2/export',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({ids:r.rows.map(x=>x.id),format:'xlsx',cols:visibleCols()})});if(!res.ok)return toast('Export failed');
 const b=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`harbor-comps-${new Date().toISOString().slice(0,10)}.xlsx`;a.click();toast(`Exported ${r.rows.length} comps${r.total>r.rows.length?' (first 5,000)':''}`)}
const COLKEY='hc_cols_v1';function visibleCols(){try{return JSON.parse(localStorage.getItem(COLKEY))||null}catch{return null}}
const BASECOLS=TCOLS.slice();
function applyCols(){const v=visibleCols();TCOLS.length=0;BASECOLS.filter(c=>!v||v.includes(c[0])).forEach(c=>TCOLS.push(c))}
TCOLS.push(['Tags',x=>String(x.product_tags||'').split('|').filter(Boolean).map(t=>TAGL[t]||t).join(', ')],['Basis',x=>esc(x.rent_basis||'')],['Precision',x=>x.date_precision&&x.date_precision!=='day'?x.date_precision:'']);BASECOLS.push(...TCOLS.slice(BASECOLS.length));applyCols();
function colChooser(){const v=visibleCols()||BASECOLS.map(c=>c[0]);openModal(`<h3>Columns</h3><div class="checks" style="margin-top:8px">${BASECOLS.map(c=>`<label><input type="checkbox" value="${esc(c[0])}" ${v.includes(c[0])?'checked':''}>${esc(c[0])}</label>`).join('')}</div><div class="row2" style="justify-content:flex-end"><button class="btn" id="creset">Reset</button><button class="btn primary" id="cok">Apply</button></div>`);
 $('#cok').onclick=()=>{localStorage.setItem(COLKEY,JSON.stringify($$('#mbox input:checked').map(i=>i.value)));applyCols();closeModal();renderDb()};$('#creset').onclick=()=>{localStorage.removeItem(COLKEY);applyCols();closeModal();renderDb()}}

// ---------- building drawer extras: comp edit + history, players, add to deal ----------
const _renderDrawer=renderDrawer;
renderDrawer=function(edit){_renderDrawer(edit);const d=CUR,p=d.property;const b=$('#dfind');if(b)b.textContent='Comp this building';
 const tags=String(p.product_tags||'').split('|').filter(Boolean);if(tags.length)$('#dh .acts').insertAdjacentHTML('beforebegin',`<div class="tagrow" style="margin-top:6px">${tags.map(t=>`<span class="tg ro" style="background:var(--peach-soft)">${esc(TAGL[t]||t)}</span>`).join('')}</div>`);
 const comps=d.comps.filter(c=>c.status==='active');
 $$('#dbody .deal').forEach((el,i)=>{const c=comps[i];if(!c)return;const h=el.querySelector('.h');
  h.insertAdjacentHTML('beforeend',`<button class="btn sm" data-ed="${c.id}">Edit</button><button class="btn sm" data-todeal="${c.id}">+ Deal</button>`);
  const names=[['Buyer',c.buyer],['Seller',c.seller],['Tenant',c.tenant],['Landlord',c.landlord]].filter(x=>x[1]);
  if(names.length)el.insertAdjacentHTML('beforeend',`<div class="faint" style="font-size:12px;margin-top:4px">${names.map(([l,n])=>`${l}: <a style="cursor:pointer;text-decoration:underline dotted" data-player="${esc(n)}">${esc(n)}</a>`).join(' · ')} · <a style="cursor:pointer" data-hist="${c.id}">History</a></div><div id="hist-${c.id}"></div>`);
  else el.insertAdjacentHTML('beforeend',`<div class="faint" style="font-size:12px;margin-top:4px"><a style="cursor:pointer" data-hist="${c.id}">History</a></div><div id="hist-${c.id}"></div>`)});
 $$('#dbody [data-ed]').forEach(b=>b.onclick=()=>editComp(comps.find(c=>c.id==b.dataset.ed)));
 $$('#dbody [data-todeal]').forEach(b=>b.onclick=()=>addToDealMenu(b,[+b.dataset.todeal]));
 $$('#dbody [data-player]').forEach(a=>a.onclick=async()=>{const r=await api('/api/v2/players?'+new URLSearchParams({q:a.dataset.player,limit:1}));if(r.players[0]){closeDrawer();location.hash='#player/'+r.players[0].id}else toast('No player page yet')});
 $$('#dbody [data-hist]').forEach(a=>a.onclick=async()=>{const r=await api(`/api/v2/edits?entity=comp&id=${a.dataset.hist}`);$('#hist-'+a.dataset.hist).innerHTML=r.edits.length?r.edits.map(e=>`<div class="hist">${esc(e.at.slice(0,16))} · ${esc((e.by_user||'').split('@')[0])} · ${esc(e.field)}: ${esc(e.old_value??'—')} → <b>${esc(e.new_value??'—')}</b>${e.reason?' · '+esc(e.reason):''}</div>`).join(''):'<div class="hist">No edits - this is exactly what the source file said.</div>'})}
function editComp(c){const F=c.record_kind==='lease'?['tenant','leased_sf','rent_psf_yr','lease_structure','lease_start','term_months','escalation_pct','free_rent_months','ti_psf','landlord']:c.record_kind==='listing'?['available_sf','asking_rent_psf_yr','asking_price']:['sale_price','price_psf','cap_rate_pct','sale_date','buyer','seller','sale_type','occupancy_pct'];
 openModal(`<h3>Edit comp</h3><div class="muted" style="margin-bottom:10px">The original value from the source file stays in the history.</div><div class="fgrid">${F.map(f=>`<div class="fc"><div class="l">${f.replace(/_/g,' ')}</div><input data-f="${f}" value="${esc(c[f]??'')}"/></div>`).join('')}</div><div class="row2"><input type="text" id="ereason" placeholder="Why (e.g. confirmed with broker)" style="flex:1"/></div><div class="row2" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="esave">Save</button></div>`);
 $('#esave').onclick=async()=>{const f={};$$('#mbox [data-f]').forEach(i=>{const k=i.dataset.f,v=i.value.trim();if(v===String(c[k]??''))return;f[k]=v===''?null:/^(tenant|buyer|seller|landlord|lease_structure|sale_type|lease_start|sale_date)$/.test(k)?v:+v.replace(/[$,%]/g,'')});
  if(!Object.keys(f).length)return closeModal();await api('/api/v2/comps/'+c.id,{method:'PATCH',body:JSON.stringify({fields:f,reason:$('#ereason').value||null})});closeModal();toast('Saved - change logged');openProperty(CUR.property.id)}}
async function addToDealMenu(anchor,ids){if(!DEALS.length)await loadDealList();
 pickMenu(anchor,[...DEALS.map(d=>[esc(d.name),async()=>{await api(`/api/v2/deals/${d.id}/items`,{method:'POST',body:JSON.stringify({comp_ids:ids,state:'add'})});toast(`Added ${ids.length} to ${d.name}`);loadDealList();if(DEAL&&DEAL.deal.id===d.id)reloadDeal()}]),['+ New deal…',()=>newDealModal()]])}

// ---------- export endpoint for Find CSV keeps working; Find extras ----------
(function findExtras(){const tb=$('#v-find .toolbar');
 tb.insertAdjacentHTML('beforeend',`<button class="btn" id="fdraw" title="Draw an area on the map">Draw area</button><button class="btn" id="fsave">Save search</button><select id="fsaved" style="max-width:160px"><option value="">Saved…</option></select>`);
 $('#fsave').onclick=saveSearch;$('#fdraw').onclick=toggleDraw;$('#fsaved').onchange=()=>{const v=+$('#fsaved').value;if(v)runSaved(v);$('#fsaved').value=''};loadSavedSearches();
 const sb=document.createElement('button');sb.className='btn sm';sb.id='fseldeal';sb.textContent='Add to deal';
 const obs=new MutationObserver(()=>{const bar=$('#fselbar');if(bar&&!bar.querySelector('#fseldeal')){const b=sb.cloneNode(true);bar.insertBefore(b,bar.querySelector('#fselx'));b.onclick=()=>addToDealMenu(b,[...SEL])}
  // per-row "+ Deal"
  $$('#flist .row .side').forEach(s=>{if(s.querySelector('.rdeal'))return;const id=+s.closest('.row').dataset.id;s.insertAdjacentHTML('afterbegin',`<button class="btn sm rdeal" title="Add to a deal">+ Deal</button>`);s.querySelector('.rdeal').onclick=e=>{e.stopPropagation();addToDealMenu(e.target,[id])}});
  sanityCard()});obs.observe($('#flist'),{childList:true})})();
let SAVED=[];
async function loadSavedSearches(){try{const r=await api('/api/v2/saved?kind=search');SAVED=r.saved;$('#fsaved').innerHTML='<option value="">Saved…</option>'+SAVED.map(s=>`<option value="${s.id}">${s.alert?'● ':''}${esc(s.name)}${s.n_alerts?` (${s.n_alerts} new)`:''}</option>`).join('')}catch{}}
async function saveSearch(){if(!LAST)return toast('Run a search first');openModal(`<h3>Save this search</h3><input type="text" id="sname" style="width:100%" value="${esc((q.value||'').slice(0,60))}"/><label style="display:block;margin-top:10px"><input type="checkbox" id="salert" checked> Tell me when a new comp matches (checked daily)</label><div class="row2" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="sok">Save</button></div>`);
 $('#sok').onclick=async()=>{await api('/api/v2/saved',{method:'POST',body:JSON.stringify({kind:'search',name:$('#sname').value||'Saved search',query:q.value,filters:{filters:filtersObj(),parsed:LAST.parsed},location:LAST.location&&LAST.location.kind==='pin'?{lat:LAST.location.lat,lng:LAST.location.lng,radius_mi:LAST.location.radius,label:LAST.location.label}:null,polygon:POLY.length>2?POLY:null,alert:$('#salert').checked})});closeModal();toast('Saved');loadSavedSearches()}}
function runSaved(id){const s=SAVED.find(x=>x.id===id);show('find');if(!s){loadSavedSearches().then(()=>{const t=SAVED.find(x=>x.id===id);if(t)runSaved(id)});return}q.value=s.query||'';autoH();if(s.location)pin=s.location;POLY=s.polygon||[];drawPoly();run()}
// polygon filter (client side on the ranked results)
let POLY=[],DRAWING=false,polyL=null,polyPts=[];
function toggleDraw(){DRAWING=!DRAWING;$('#fdraw').textContent=DRAWING?'Finish area':'Draw area';$('#fsplit').classList.toggle('drawing',DRAWING);
 if(DRAWING){POLY=[];polyPts=[];drawPoly();toast('Click points on the map, then press "Finish area"');if(isMobile()&&!$('#fsplit').classList.contains('showmap'))$('#fmapbtn').click()}else{POLY=polyPts.slice();drawPoly();if(POLY.length>2&&LAST)renderFind()}}
fmap.off('click');fmap.on('click',e=>{if(DRAWING){polyPts.push([e.latlng.lat,e.latlng.lng]);POLY=polyPts.slice();drawPoly();return}pin={lat:e.latlng.lat,lng:e.latlng.lng,radius_mi:Number($('#f-rad').value)||3,label:'map pin'};toast('Searching around the pin…');run()});
function drawPoly(){polyL&&polyL.remove();polyL=null;if(POLY.length>1)polyL=L.polygon(POLY,{color:'#7d1d1d',weight:2,fillOpacity:.06,dashArray:DRAWING?'4 4':null}).addTo(fmap)}
function inPoly(lat,lng){let ins=false;for(let i=0,j=POLY.length-1;i<POLY.length;j=i++){const [yi,xi]=POLY[i],[yj,xj]=POLY[j];if(yi>lat!==yj>lat&&lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)ins=!ins}return ins}
const _sorted=sorted;sorted=function(){const a=_sorted();return POLY.length>2&&!DRAWING?a.filter(x=>x.latitude!=null&&inPoly(x.latitude,x.longitude)):a};
const _renderReading=renderReading;renderReading=function(r){_renderReading(r);if(POLY.length>2)$('#reading').insertAdjacentHTML('beforeend',`<span class="chip x" id="polyx">Inside drawn area <b>×</b></span>`);const x=$('#polyx');if(x)x.onclick=()=>{POLY=[];drawPoly();x.remove();renderFind()}};
// sanity check: a number in the request vs the results
function sanityCard(){if(!LAST||$('#sanity'))return;const t=q.value;const m=/\$\s?(\d+(?:\.\d+)?)\s*(?:\/|\s*per\s*)?\s*(?:psf|sf|sq)?\s*(\/\s*mo|per month|monthly)?/i.exec(t);if(!m)return;let v=+m[1];
 const rows=sorted();const leases=rows.filter(r=>r.record_kind==='lease'&&r.rent_psf_yr),sales=rows.filter(r=>(r.record_kind==='sale')&&r.price_psf);
 let arr,label,unit;if(v<3||m[2]){v=v*12;arr=leases.map(r=>r.rent_psf_yr);label='leases';unit='/SF/yr'}else if(v<40&&leases.length>=sales.length){arr=leases.map(r=>r.rent_psf_yr);label='leases';unit='/SF/yr'}else{arr=sales.map(r=>r.price_psf);label='sales';unit='/SF'}
 if(arr.length<3)return;arr.sort((a,b)=>a-b);const p=Math.round(100*arr.filter(x=>x<=v).length/arr.length);
 const card=`<div class="sanity" id="sanity"><div style="min-width:200px"><div class="faint" style="font-size:10.5px;font-weight:600;letter-spacing:.06em">SANITY CHECK</div><b>${fmt.psf(v)}${unit}</b> vs these comps</div><div class="pctl"><i style="left:${Math.min(99,p)}%"></i></div><div style="min-width:200px"><b>${p}th percentile</b> of ${arr.length} ${label}<br><span class="faint">range ${fmt.psf(arr[0])} – ${fmt.psf(arr[arr.length-1])}, median ${fmt.psf(arr[arr.length>>1])}</span></div></div>`;
 const st=$('#flist .statstrip');if(st)st.insertAdjacentHTML('afterend',card)}

// ================= INBOX =================
async function loadInbox(){$('#ways').innerHTML=`<div class="way"><b>Drop or paste</b>Excel, CSV or PDF in any layout, or comps pasted from Slack or email. Below.</div>
 <div class="way"><b>Forward an email</b>Send comp files to <a href="mailto:comps@harborcap.dev" style="font-weight:600">comps@harborcap.dev</a> from your Harbor address. Clean rows are saved automatically; anything unclear waits here. <span class="faint" id="mailst"></span></div>
 <div class="way"><b>Slack channels</b>Watching #acq-comp-tracker and #market-research turns on once the Harbor Slack bot is connected. <span class="badge b-warn">waiting on bot token</span></div>`;
 try{const f=await api('/api/v2/files');const need=f.files.filter(x=>x.status==='review'||x.status==='needs_vision'||x.status==='failed');const busy=f.files.filter(x=>['queued','q_extracting','surveying','extracting'].includes(x.status)&&x.via==='email');
  $('#inboxct').style.display=need.length?'':'none';$('#inboxct').textContent=need.length;$('#inboxct').classList.toggle('hot',need.length>0);
  $('#attention').innerHTML=(need.length||busy.length)?`<div class="sect" style="margin-top:0">Needs a person (${need.length})</div><div class="panel" style="padding:0;margin-top:0">${[...busy,...need].map(x=>`<div class="rv" style="grid-template-columns:minmax(0,1.4fr) 1fr 150px;cursor:pointer" data-j="${x.job_id||''}"><div><b>${esc(x.filename)}</b><div class="faint">${esc(x.via==='email'?'Email · '+(x.via_ref||''):'Uploaded by '+(x.uploaded_by||'').split('@')[0])} · ${esc((x.uploaded_at||'').slice(0,10))}</div></div><div class="faint">${esc((x.summary||'').slice(0,140))}</div><div>${x.status==='review'?`<span class="badge b-warn">${x.held||''} held for review</span>`:x.status==='needs_vision'?'<span class="badge b-warn">scanned - open to read</span>':x.status==='failed'?'<span class="badge b-bad">failed</span>':'<span class="badge">reading…</span>'}</div></div>`).join('')}</div>`:'';
  $$('#attention [data-j]').forEach(el=>el.onclick=()=>{if(!el.dataset.j)return;JOB=el.dataset.j;$('#upflow').style.display='block';$('#survey').style.display='none';[1,2,3,4].forEach(i=>step(i,'done'));step(5,'on');bar(1);loadJob();$('#upflow').scrollIntoView({behavior:'smooth'})})}catch{}}
// side-by-side source preview for the review step
const _loadJob=loadJob;loadJob=async function(){await _loadJob();if(!JOB)return;const host=$('#review');const panel=host.querySelector('.panel');if(!panel||host.querySelector('.revgrid'))return;
 const grid=document.createElement('div');grid.className='revgrid';panel.parentNode.insertBefore(grid,panel);grid.appendChild(panel);const sp=document.createElement('div');sp.innerHTML='<div class="sect" style="margin-top:0">Source file</div><div class="srcpane" id="srcpane"><div class="skel"></div></div>';grid.appendChild(sp);
 try{const s=await api(`/api/v2/jobs/${JOB}/source`);SRCDOC=s;renderSrc(s.sheets[0]?.name)}catch(e){$('#srcpane').innerHTML=`<div class="muted" style="padding:10px">${esc(e.message)}</div>`}
 $$('#review .rv[data-idx]').forEach(r=>r.addEventListener('click',e=>{if(e.target.closest('select,input,button,.ed'))return;const txt=r.querySelector('.faint')?.textContent||'';const m=/row ([\d,]+)/.exec(txt);const sheet=(SRCDOC?.sheets||[]).find(s=>txt.includes(s.name));if(sheet)renderSrc(sheet.name);if(m)hitRows(m[1].split(',').map(Number))}))};
let SRCDOC=null;
function renderSrc(name){const s=(SRCDOC.sheets||[]).find(x=>x.name===name)||SRCDOC.sheets[0];if(!s){$('#srcpane').innerHTML='<div class="muted" style="padding:10px">No preview</div>';return}
 $('#srcpane').innerHTML=`${SRCDOC.sheets.length>1?`<div style="padding:6px 8px;display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:0;background:#fbfbfa;z-index:1">${SRCDOC.sheets.map(x=>`<button class="btn sm ${x.name===s.name?'primary':''}" data-sh="${esc(x.name)}">${esc(x.name)}</button>`).join('')}</div>`:''}<table>${s.rows.map(r=>`<tr data-r="${r.n}"><td class="rn">${r.n}</td>${r.c.map(v=>`<td class="${r.c.length===1?'wide':''}" title="${esc(v)}">${esc(v)}</td>`).join('')}</tr>`).join('')}</table>${s.truncated?'<div class="faint" style="padding:6px">Preview shows the first rows only.</div>':''}`;
 $$('#srcpane [data-sh]').forEach(b=>b.onclick=()=>renderSrc(b.dataset.sh))}
function hitRows(ns){$$('#srcpane tr.hit').forEach(t=>t.classList.remove('hit'));let first=null;ns.forEach(n=>{const tr=$(`#srcpane tr[data-r="${n}"]`);if(tr){tr.classList.add('hit');first=first||tr}});first&&first.scrollIntoView({block:'center',behavior:'smooth'})}
loadInbox();
</script>
