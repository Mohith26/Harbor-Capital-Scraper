{% extends "base.html" %}
{% block page_title %}Upload & Process{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Drop Zone -->
    <div id="upload-zone" x-data="{dragging: false}"
         role="button" tabindex="0"
         aria-label="Upload a comp file"
         class="drop-zone" :class="dragging && 'dragover'"
         @dragover.prevent="dragging = true"
         @dragleave.prevent="dragging = false"
         @drop.prevent="dragging = false; handleDrop($event)"
         @click="$refs.fileInput.click()"
         @keydown.enter.prevent="$refs.fileInput.click()"
         @keydown.space.prevent="$refs.fileInput.click()">
        <svg class="w-12 h-12 mx-auto mb-3 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
        </svg>
        <p class="text-sm font-medium">Drop your comp file here or click to browse</p>
        <p class="text-xs text-gray-400 mt-1">Supports Excel (.xlsx), CSV, and PDF files</p>
        <form id="upload-form" hx-post="/upload/file" hx-target="#upload-preview" hx-encoding="multipart/form-data"
              hx-indicator="#upload-spinner">
            <input type="file" name="file" x-ref="fileInput" class="hidden"
                   accept=".xlsx,.xls,.csv,.pdf"
                   @change="htmx.trigger($el.closest('form'), 'submit')">
        </form>
    </div>

    <!-- Loading spinner -->
    <div id="upload-spinner" class="htmx-indicator text-center py-8">
        <div class="inline-block w-8 h-8 border-4 border-gray-200 border-t-[#F5A623] rounded-full animate-spin"></div>
        <p class="text-sm text-gray-500 mt-2">Processing file...</p>
    </div>

    <!-- Preview area (HTMX target) -->
    <div id="upload-preview" class="mt-6"></div>
</div>

<script>
function handleDrop(event) {
    var files = event.dataTransfer.files;
    if (files.length > 0) {
        var input = document.querySelector('#upload-form input[type=file]');
        var dt = new DataTransfer();
        dt.items.add(files[0]);
        input.files = dt.files;
        htmx.trigger(document.getElementById('upload-form'), 'submit');
    }
}
</script>
{% endblock %}
