<script>
(function() {
    var data = {{ table_data|safe }};
    var columns = {{ columns|safe }};

    // Build AG Grid column defs from data columns
    var colDefs = columns.map(function(col) {
        var def = { field: col, headerName: col.replace(/_/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); }) };
        // Format currency columns
        if (['sale_price', 'price_per_sf', 'rate_monthly', 'rate_annually', 'ti_allowance'].indexOf(col) >= 0) {
            def.valueFormatter = function(params) {
                if (params.value == null) return '';
                return '$' + Number(params.value).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            };
        }
        // Format size columns
        if (['building_size', 'leased_sf'].indexOf(col) >= 0) {
            def.valueFormatter = function(params) {
                if (params.value == null) return '';
                return Number(params.value).toLocaleString(undefined, {maximumFractionDigits: 0}) + ' SF';
            };
        }
        // Hide certain columns
        if (['raw_address_data', 'latitude', 'longitude', 'source_file_url',
             'costar_specs', 'costar_candidates', 'costar_enriched_at'].indexOf(col) >= 0) {
            def.hide = true;
        }
        if (col === 'id') {
            def.width = 80;
        }
        // CoStar enrichment: deep-link + status badge
        if (col === 'costar_url') {
            def.headerName = 'CoStar';
            def.cellRenderer = function(params) {
                if (!params.value) return '';
                return '<a href="' + params.value + '" target="_blank" rel="noopener" '
                     + 'style="color:#2563eb;text-decoration:underline;">View ↗</a>';
            };
        }
        if (col === 'costar_status') {
            def.headerName = 'CoStar Status';
            def.cellRenderer = function(params) {
                var v = params.value || 'pending';
                var colors = {enriched:'#16a34a', ambiguous:'#d97706', not_found:'#6b7280',
                              pending:'#3b82f6', error:'#dc2626'};
                return '<span style="color:' + (colors[v] || '#6b7280')
                     + ';font-weight:600;text-transform:capitalize;">' + v + '</span>';
            };
        }
        return def;
    });

    // Init or update grid — always init so empty-state still shows column headers
    var container = document.getElementById('ag-grid-container');
    if (container) {
        if (colDefs.length === 0) {
            // No data at all in DB — show a friendly message instead of a blank grid
            container.innerHTML = '<div class="text-center text-sm text-gray-400 py-12">No comps in the database yet. Upload a file to get started.</div>';
        } else {
            initGrid('ag-grid-container', colDefs, data, {
                rowSelection: {
                    mode: 'multiRow',
                    checkboxes: true,
                    headerCheckbox: true,
                },
                pagination: true,
                paginationPageSize: 50,
            });
        }
    }

    // Update record count
    var countEl = document.getElementById('record-count');
    if (countEl) {
        countEl.textContent = 'Showing ' + data.length + ' of {{ total }} records';
    }
})();
</script>
