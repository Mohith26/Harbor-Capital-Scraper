{% if active_filters %}
<div class="flex flex-wrap gap-2 mt-3" id="filter-chips">
    {% for key, display in active_filters %}
    <span class="filter-chip">
        {{ display }}
        <span class="filter-chip-x" onclick="removeFilter('{{ key }}')">&times;</span>
    </span>
    {% endfor %}
</div>
{% endif %}
